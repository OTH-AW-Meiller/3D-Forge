<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <style>.spark{transform-origin:center;animation:spark 2.4s ease-in-out infinite}@keyframes spark{50%{opacity:.35}}</style>
  <defs>
    <linearGradient id="lgTop" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#bcd0ff"/><stop offset="1" stop-color="#8f7cff"/></linearGradient>
    <linearGradient id="lgLeft" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#5b6cf0"/><stop offset="1" stop-color="#2f2f8f"/></linearGradient>
    <linearGradient id="lgRight" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b46b8"/><stop offset="1" stop-color="#191a55"/></linearGradient>
    <linearGradient id="lgForge" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffd27a"/><stop offset="1" stop-color="#ff6a2b"/></linearGradient>
  </defs>
    <!-- isometric cube with a chamfered, glowing front edge -->
    <polygon points="50,6 90,28 50,50 10,28" fill="url(#lgTop)"/>
    <polygon points="10,28 50,50 50,94 10,72" fill="url(#lgLeft)"/>
    <polygon points="90,28 50,50 50,94 90,72" fill="url(#lgRight)"/>
    <polygon points="50,50 56,46.7 56,91 50,94" fill="url(#lgForge)"/>
    <polygon points="50,50 44,46.7 44,91 50,94" fill="url(#lgForge)" opacity=".85"/>
    <polyline points="50,6 90,28 90,72 50,94 10,72 10,28 50,6" fill="none" stroke="#e9ecff" stroke-opacity=".55" stroke-width="1.6" stroke-linejoin="round"/>
    <g class="spark" fill="#ffd27a"><path d="M84 6 l2.2 5.8 5.8 2.2 -5.8 2.2 -2.2 5.8 -2.2 -5.8 -5.8 -2.2 5.8 -2.2z"/></g>
</svg>
